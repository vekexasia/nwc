<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New World live</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.4 ui-monospace, monospace; background: #14161a; color: #e6e6e6; display: flex; height: 100vh; }
  #left { flex: 0 0 46%; display: flex; flex-direction: column; border-right: 1px solid #2b2f36; }
  #right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 8px 10px; border-bottom: 1px solid #2b2f36; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #canvasWrap { flex: 1; position: relative; }
  canvas { width: 100%; height: 100%; display: block; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #23272e; white-space: nowrap; }
  th { position: sticky; top: 0; background: #191c21; font-weight: normal; color: #9aa4b2; }
  tbody tr.me { background: #1f2a1f; }
  #tableWrap { overflow: auto; flex: 1; }
  .dim { color: #9aa4b2; }
  .warn { color: #e0a458; }
  a { color: #7fb3ff; }
  select, button { background: #1c2026; color: #e6e6e6; border: 1px solid #333a44; border-radius: 4px; padding: 2px 6px; font: inherit; }
</style>
</head>
<body>
<div id="left">
  <header>
    <b>New World live</b>
    <span class="dim" id="status">starting</span>
    <span class="dim" id="counters"></span>
    <button id="identify">identify me: walk 3s</button>
    <span class="dim" id="meLabel">me: not identified</span>
    <a id="maplink" class="dim" href="#" target="_blank">community map</a>
  </header>
  <div id="canvasWrap"><canvas id="canvas"></canvas></div>
</div>
<div id="right">
  <header>
    <span class="dim">objects seen</span>
    <span class="dim" id="hint">the probe does not know which object is you: pick it here and it stays.
      Names are provisional (the field types are not decoded yet); elevation is the raw wire value.</span>
  </header>
  <div id="tableWrap">
    <table>
      <thead><tr><th>object</th><th>name</th><th>health</th><th>mana</th><th>x</th><th>y</th><th>elev (raw)</th><th>age</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
<script>
const MAX_POINTS = 4000;
const trails = new Map();
let selected = localStorage.getItem("nw.live.me") || "";
let lastCounters = null;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
document.getElementById("identify").onclick = async (event) => {
  event.target.disabled = true;
  event.target.textContent = "walk now (3s)...";
  try {
    const result = await (await fetch("/calibrate", { method: "POST" })).json();
    selected = result.object || "";
    if (selected) {
      document.getElementById("meLabel").textContent =
        `me: ${selected.slice(0, 12)} (moved ${result.distance ?? "?"} units, ${result.margin_over_next ?? "?"}x the next)`;
    } else {
      document.getElementById("meLabel").textContent = "me: " + (result.note || "nothing identified");
    }
  } catch (error) {
    document.getElementById("meLabel").textContent = "me: calibration failed";
  }
  event.target.disabled = false;
  event.target.textContent = "identify me: walk 3s";
};

function fit() {
  const box = canvas.parentElement.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(200, Math.floor(box.width * ratio));
  canvas.height = Math.max(200, Math.floor(box.height * ratio));
}
window.addEventListener("resize", fit);

function draw(objects) {
  const w = canvas.width, h = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const points = [];
  for (const trail of trails.values()) for (const p of trail) points.push(p);
  if (!points.length) {
    ctx.fillStyle = "#6b7280"; ctx.font = "14px ui-monospace"; ctx.fillText("waiting for positions", 16, 28);
    return;
  }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of points) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
  const spanX = Math.max(maxX - minX, 20), spanY = Math.max(maxY - minY, 20);
  const scale = Math.min((w - 40) / spanX, (h - 40) / spanY);
  const ox = 20 + (w - 40 - spanX * scale) / 2, oy = h - 20 - (h - 40 - spanY * scale) / 2;
  const toScreen = p => [ox + (p.x - minX) * scale, oy - (p.y - minY) * scale];
  for (const [key, trail] of trails) {
    if (trail.length < 1) continue;
    const isMe = key === selected;
    ctx.strokeStyle = isMe ? "#7cf07c" : "rgba(140,160,190,0.35)";
    ctx.lineWidth = isMe ? 2.5 : 1;
    ctx.beginPath();
    trail.forEach((p, i) => { const [sx, sy] = toScreen(p); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); });
    ctx.stroke();
    const [lx, ly] = toScreen(trail[trail.length - 1]);
    ctx.fillStyle = isMe ? "#7cf07c" : "rgba(180,200,220,0.6)";
    ctx.beginPath(); ctx.arc(lx, ly, isMe ? 4 : 2, 0, Math.PI * 2); ctx.fill();
  }
  const me = objects[selected];
  if (me && me.position) {
    const [sx, sy] = toScreen(me.position);
    ctx.fillStyle = "#fff"; ctx.font = "12px ui-monospace";
    ctx.fillText(`${me.name || selected}  x=${me.position.x} y=${me.position.y}`, sx + 8, sy - 8);
  }
  ctx.fillStyle = "#6b7280"; ctx.font = "11px ui-monospace";
  ctx.fillText(`${Math.round(spanX)} x ${Math.round(spanY)} units  scale ${scale.toFixed(2)} px/unit`, 12, 16);
}

function render(snapshot) {
  const objects = snapshot.objects || {};
  for (const [key, slot] of Object.entries(objects)) {
    if (!slot.position) continue;
    let trail = trails.get(key);
    if (!trail) { trail = []; trails.set(key, trail); }
    const last = trail[trail.length - 1];
    if (!last || last.x !== slot.position.x || last.y !== slot.position.y) trail.push(slot.position);
    while (trail.length > MAX_POINTS) trail.shift();
  }
  const rows = Object.entries(objects)
    .sort((a, b) => (b[1].position_at || b[1].vitals_at || 0) - (a[1].position_at || a[1].vitals_at || 0));
  const now = snapshot.now;
  document.getElementById("rows").innerHTML = rows.map(([key, slot]) => {
    const age = Math.max(slot.position_at || 0, slot.vitals_at || 0, slot.player_at || 0);
    const p = slot.position || {};
    return `<tr class="${key === selected ? "me" : ""}" data-key="${key}">` +
      `<td>${key.slice(0, 12)}</td><td>${slot.name || '<span class="dim">?</span>'}</td>` +
      `<td>${slot.health ?? '<span class="dim">-</span>'}</td><td>${slot.mana ?? '<span class="dim">-</span>'}</td>` +
      `<td>${p.x ?? "-"}</td><td>${p.y ?? "-"}</td><td>${p.elev_raw ?? "-"}</td>` +
      `<td>${age ? (now - age).toFixed(1) + "s" : "-"}</td></tr>`;
  }).join("");
  for (const row of document.querySelectorAll("#rows tr")) {
    row.onclick = () => { selected = row.dataset.key; localStorage.setItem("nw.live.me", selected); syncSelect(objects); };
  }
  if (selected) document.getElementById("meLabel").textContent = `me: ${selected.slice(0, 12)}`;
  const me = objects[selected];
  const link = document.getElementById("maplink");
  if (me && me.position) {
    link.href = `https://aeternum-map.th.gl/?x=${Math.round(me.position.x)}&y=${Math.round(me.position.y)}&zoom=6`;
    link.textContent = "community map @" + Math.round(me.position.x) + "," + Math.round(me.position.y);
  } else {
    link.href = "#"; link.textContent = "community map (pick an object)";
  }
  document.getElementById("status").textContent = snapshot.last_line_age_s == null
    ? "no data yet" : `last line ${snapshot.last_line_age_s}s ago`;
  document.getElementById("counters").textContent = JSON.stringify(snapshot.counters);
  lastCounters = snapshot.counters;
  draw(objects);
}

async function poll() {
  try {
    const response = await fetch("/state", { cache: "no-store" });
    render(await response.json());
  } catch (error) {
    document.getElementById("status").textContent = "server unreachable";
  }
  setTimeout(poll, 250);
}
fit(); poll();
</script>
</body>
</html>
